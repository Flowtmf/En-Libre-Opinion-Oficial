<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>En Libre Opinión - Análisis y Debates</title>
    <style>
        :root {
            --fondo-negro: #0b0b0f;
            --azul-oscuro: #0a1128;
            --morado-profundo: #4a00e0;
            --azul-brillante: #005c97;
            --texto-claro: #f8f9fa;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, var(--fondo-negro) 0%, var(--azul-oscuro) 100%);
            color: var(--texto-claro);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Tarjeta principal */
        .contenedor-principal {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top: 4px solid var(--morado-profundo);
            border-radius: 16px;
            padding: 40px;
            max-width: 650px;
            width: 90%;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(74, 0, 224, 0.15);
            text-align: center;
        }

        /* El "coso azul" ahora contiene el título */
        .etiqueta-titulo {
            display: inline-block;
            background: linear-gradient(90deg, var(--morado-profundo), var(--azul-brillante));
            padding: 10px 25px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0, 92, 151, 0.4);
            color: var(--texto-claro);
        }

        /* Subtítulo principal (H1) */
        h1 {
            font-size: 2.1rem;
            margin: 0 0 15px 0;
            font-family: 'Georgia', serif;
            background: linear-gradient(to right, #ffffff, #caced8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.3;
        }

        /* Texto de apoyo mejorado */
        h2 {
            font-size: 1.1rem;
            font-weight: 400;
            color: #aeb4c5;
            margin: 0 0 40px 0;
            line-height: 1.6;
            font-style: italic;
        }

        /* Reproductor de Audio Personalizado */
        .reproductor-custom {
            background: rgba(10, 17, 40, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: inset 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .controles-superiores {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .btn-control {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--texto-claro);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn-control:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.05);
        }

        .btn-play {
            width: 65px;
            height: 65px;
            background: linear-gradient(135deg, var(--morado-profundo), var(--azul-brillante));
            border: none;
            box-shadow: 0 5px 15px rgba(74, 0, 224, 0.4);
        }

        .btn-play:hover {
            background: linear-gradient(135deg, #5b14e6, #0073bc);
        }

        .btn-play svg {
            fill: white;
            width: 24px;
            height: 24px;
            margin-left: 4px;
        }

        .zona-progreso {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .tiempo {
            font-size: 0.9rem;
            color: #aeb4c5;
            width: 50px;
            font-variant-numeric: tabular-nums;
        }

        .barra-contenedor {
            flex-grow: 1;
            height: 24px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .barra-progreso {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--azul-brillante), var(--morado-profundo));
            border-radius: 12px;
            pointer-events: none;
            transition: width 0.1s linear;
        }

        .nota-pie {
            font-size: 0.9rem;
            color: #6c757d;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 20px;
        }
    </style>
</head>
<body>

    <div class="contenedor-principal">
        
        <!-- Título principal en la etiqueta azul/morada -->
        <div class="etiqueta-titulo">En Libre Opinión</div>
        
        <!-- Subtítulo con la "a" minúscula como pidió Eve -->
        <h1>Análisis de casos y sentencias atípicas</h1>
        <h2>Debates y reflexiones sobre el derecho contemporáneo</h2>
        
        <div class="reproductor-custom">
            <!-- Archivo de audio -->
            <audio id="audioPrincipal">
                <source src="audio.mp3" type="audio/mpeg">
                Tu navegador no soporta el formato de audio.
            </audio>

            <!-- Controles visuales -->
            <div class="controles-superiores">
                <button class="btn-control" onclick="saltar(-5)" title="Retroceder 5 segundos">-5s</button>
                
                <button class="btn-control btn-play" id="btnPlay" onclick="alternarReproduccion()">
                    <svg id="iconoPlay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </button>
                
                <button class="btn-control" onclick="saltar(5)" title="Adelantar 5 segundos">+5s</button>
            </div>

            <div class="zona-progreso">
                <span class="tiempo" id="tiempoActual">0:00</span>
                
                <div class="barra-contenedor" id="contenedorBarra" onclick="adelantarBarra(event)">
                    <div class="barra-progreso" id="barraProgreso"></div>
                </div>
                
                <span class="tiempo" id="tiempoTotal">0:00</span>
            </div>
        </div>

        <div class="nota-pie">
            Presentación oral para evaluación y análisis crítico.
        </div>
    </div>

    <script>
        const audio = document.getElementById('audioPrincipal');
        const btnPlay = document.getElementById('btnPlay');
        const iconoPlay = document.getElementById('iconoPlay');
        const barraProgreso = document.getElementById('barraProgreso');
        const contenedorBarra = document.getElementById('contenedorBarra');
        const txtTiempoActual = document.getElementById('tiempoActual');
        const txtTiempoTotal = document.getElementById('tiempoTotal');

        const svgPlay = '<path d="M8 5v14l11-7z"/>';
        const svgPause = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';

        function alternarReproduccion() {
            if (audio.paused) {
                audio.play();
                iconoPlay.innerHTML = svgPause;
                iconoPlay.style.marginLeft = '0';
            } else {
                audio.pause();
                iconoPlay.innerHTML = svgPlay;
                iconoPlay.style.marginLeft = '4px';
            }
        }

        function saltar(segundos) {
            audio.currentTime += segundos;
        }

        audio.addEventListener('timeupdate', () => {
            const porcentaje = (audio.currentTime / audio.duration) * 100;
            if (!isNaN(porcentaje)) {
                barraProgreso.style.width = porcentaje + '%';
            }
            txtTiempoActual.textContent = formatearTiempo(audio.currentTime);
        });

        audio.addEventListener('loadedmetadata', () => {
            txtTiempoTotal.textContent = formatearTiempo(audio.duration);
        });

        function adelantarBarra(evento) {
            const anchoTotal = contenedorBarra.clientWidth;
            const clicX = evento.offsetX;
            const porcentaje = clicX / anchoTotal;
            audio.currentTime = porcentaje * audio.duration;
        }

        function formatearTiempo(segundos) {
            if (isNaN(segundos)) return "0:00";
            const min = Math.floor(segundos / 60);
            const sec = Math.floor(segundos % 60);
            return min + ":" + (sec < 10 ? "0" : "") + sec;
        }
    </script>
</body>
</html>
